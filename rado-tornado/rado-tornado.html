  // ---------- Audio (WebAudio, no files) ----------
  let actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "sine", vol = 0.15, slideTo = null, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    flap:  () => tone(520, 0.12, "triangle", 0.12, 820),
    score: () => { tone(880, 0.09, "square", 0.07); tone(1320, 0.14, "square", 0.07, null, 0.08); },
    hit:   () => { tone(220, 0.25, "sawtooth", 0.15, 60); },
    fall:  () => tone(600, 0.5, "sine", 0.1, 120),
  };

  // ---------- Storage (best score) ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem("radoTornadoBest") || "0", 10) || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem("radoTornadoBest", String(best)); } catch (e) {} }

  // ---------- Game state ----------
  const GRAVITY = 1500;      // px/s^2
  const FLAP_V = -430;       // px/s
  const PIPE_W = 78;
  const PIPE_GAP_START = 190, PIPE_GAP_MIN = 150;
  const PIPE_SPACING = 230;
  const SPEED_START = 150, SPEED_MAX = 230;

  let state = "menu";        // menu | ready | play | dead
  let score = 0, newBest = false;
  let speed = SPEED_START;
  let pipes = [], particles = [], popups = [];
  let groundX = 0, time = 0, deadTime = 0, flash = 0, shake = 0;

  const hero = { x: W * 0.3, y: H * 0.42, vy: 0, r: 30, rot: 0, spin: 0 };

  const clouds = Array.from({ length: 6 }, (_, i) => ({
    x: Math.random() * W, y: 40 + Math.random() * 260,
    s: 0.6 + Math.random() * 0.8, v: 8 + Math.random() * 14,
  }));
  const stars = Array.from({ length: 30 }, () => ({ x: Math.random() * W, y: Math.random() * 300, t: Math.random() * 6 }));

  function reset() {
    score = 0; newBest = false; speed = SPEED_START;
    pipes = []; particles = []; popups = [];
    hero.y = H * 0.42; hero.vy = 0; hero.rot = 0;
    for (let i = 0; i < 3; i++) addPipe(W + 120 + i * PIPE_SPACING);
  }

  function gapSize() { return Math.max(PIPE_GAP_MIN, PIPE_GAP_START - score * 2); }

  function addPipe(x) {
    const gap = gapSize();
    const minY = 90, maxY = H - GROUND_H - gap - 70;
    pipes.push({ x, top: minY + Math.random() * (maxY - minY), gap, passed: false });
  }

  function flap() {
    if (state === "menu" || state === "dead") {
      if (state === "dead" && time - deadTime < 0.6) return;
      reset(); state = "ready";
      sfx.flap();
      return;
    }
    if (state === "ready") state = "play";
    if (state === "play") {
      hero.vy = FLAP_V;
      hero.spin += 9;
      sfx.flap();
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: hero.x - 10, y: hero.y + 10,
          vx: -60 - Math.random() * 90, vy: 20 + Math.random() * 80,
          life: 0.5, max: 0.5, size: 3 + Math.random() * 4, c: "rgba(255,255,255,",
        });
      }
    }
  }

  function die() {
    if (state !== "play") return;
    state = "dead"; deadTime = time;
    flash = 1; shake = 14;
    sfx.hit(); setTimeout(sfx.fall, 180);
    if (score > best) { best = score; newBest = true; saveBest(); }
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220;
      particles.push({
        x: hero.x, y: hero.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.9, max: 0.9, size: 3 + Math.random() * 5,
        c: Math.random() < 0.5 ? "rgba(255,214,79," : "rgba(160,200,255,",
      });
    }
  }

  // ---------- Input ----------
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });
  canvas.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt * 40);
    hero.spin *= Math.pow(0.02, dt);

    for (const c of clouds) {
      c.x -= c.v * dt * (state === "dead" ? 0.2 : 1);
      if (c.x < -120 * c.s) { c.x = W + 60; c.y = 40 + Math.random() * 260; }
    }

    if (state !== "dead") groundX = (groundX - speed * dt) % 48;

    if (state === "menu" || state === "ready") {
      hero.y = H * 0.42 + Math.sin(time * 4) * 10;
      hero.rot = Math.sin(time * 4) * 0.08;
    }

    if (state === "play") {
      speed = Math.min(SPEED_MAX, SPEED_START + score * 3);
      hero.vy += GRAVITY * dt;
      hero.y += hero.vy * dt;
      hero.rot = Math.max(-0.45, Math.min(1.2, hero.vy / 650));

      if (hero.y - hero.r < 0) { hero.y = hero.r; hero.vy = 0; }

      for (const p of pipes) {
        p.x -= speed * dt;
        if (!p.passed && p.x + PIPE_W < hero.x - hero.r) {
          p.passed = true; score++; sfx.score();
          popups.push({ x: hero.x, y: hero.y - 40, life: 0.8 });
        }
        // circle vs rects collision (slightly forgiving)
        const r = hero.r - 4;
        if (circleRect(hero.x, hero.y, r, p.x, -1000, PIPE_W, p.top + 1000) ||
            circleRect(hero.x, hero.y, r, p.x, p.top + p.gap, PIPE_W, H)) {
          die();
        }
      }
      if (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();
      const last = pipes[pipes.length - 1];
      if (last && last.x < W - PIPE_SPACING + 40) addPipe(last.x + PIPE_SPACING);

      if (hero.y + hero.r > H - GROUND_H) { hero.y = H - GROUND_H - hero.r; die(); }
    } else if (state === "dead") {
      if (hero.y + hero.r < H - GROUND_H) {
        hero.vy += GRAVITY * dt;
        hero.y = Math.min(H - GROUND_H - hero.r, hero.y + hero.vy * dt);
        hero.rot = Math.min(Math.PI / 2, hero.rot + dt * 6);
      }
    }

    for (const p of particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.life -= dt; p.y -= 50 * dt; }
    popups = popups.filter(p => p.life > 0);
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
    g.addColorStop(0, "#3a7bd5");
    g.addColorStop(0.55, "#7ec8f0");
    g.addColorStop(1, "#ffe6b3");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    const sg = ctx.createRadialGradient(340, 150, 10, 340, 150, 110);
    sg.addColorStop(0, "rgba(255,250,220,1)");
    sg.addColorStop(0.3, "rgba(255,236,170,.8)");
    sg.addColorStop(1, "rgba(255,236,170,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(220, 30, 240, 240);

    for (const s of stars) {
      const a = 0.15 + 0.15 * Math.sin(time * 2 + s.t);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x, s.y * 0.6, 2, 2);
    }

    for (const c of clouds) drawCloud(c.x, c.y, c.s);

    // far hills
    const off = (time * (state === "dead" ? 0 : 12)) % W;
    ctx.fillStyle = "#9fd3c7";
    hills(H - GROUND_H - 70, 60, 0.012, -off, 1.0);
    ctx.fillStyle = "#6fbf8f";
    hills(H - GROUND_H - 30, 45, 0.02, -off * 2, 2.3);
  }

  function hills(base, amp, freq, offset, phase) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = base - Math.abs(Math.sin((x - offset) * freq + phase)) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.arc(28, -12, 32, 0, Math.PI * 2);
    ctx.arc(62, 0, 26, 0, Math.PI * 2);
    ctx.arc(30, 10, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPipe(p) {
    const capH = 30, capOver = 6;
    const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    grad.addColorStop(0, "#4caf50");
    grad.addColorStop(0.3, "#9be15d");
    grad.addColorStop(0.65, "#43a047");
    grad.addColorStop(1, "#1b5e20");
    const capGrad = ctx.createLinearGradient(p.x - capOver, 0, p.x + PIPE_W + capOver, 0);
    capGrad.addColorStop(0, "#56c15a");
    capGrad.addColorStop(0.3, "#b4f07a");
    capGrad.addColorStop(0.65, "#4caf50");
    capGrad.addColorStop(1, "#1b5e20");

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#0d3b12";

    // top pipe body + cap
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, -5, PIPE_W, p.top - capH + 5);
    ctx.strokeRect(p.x, -5, PIPE_W, p.top - capH + 5);
    ctx.fillStyle = capGrad;
    roundRect(p.x - capOver, p.top - capH, PIPE_W + capOver * 2, capH, 6);
    ctx.fill(); ctx.stroke();

    // bottom pipe
    const by = p.top + p.gap;
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, by + capH, PIPE_W, H - GROUND_H - by - capH + 5);
    ctx.strokeRect(p.x, by + capH, PIPE_W, H - GROUND_H - by - capH + 5);
    ctx.fillStyle = capGrad;
    roundRect(p.x - capOver, by, PIPE_W + capOver * 2, capH, 6);
    ctx.fill(); ctx.stroke();

    // highlights
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.fillRect(p.x + 10, -5, 6, p.top - capH + 5);
    ctx.fillRect(p.x + 10, by + capH, 6, H - GROUND_H - by - capH);
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, W, GROUND_H);
    // grass strip
    const gg = ctx.createLinearGradient(0, y, 0, y + 22);
    gg.addColorStop(0, "#8be04e"); gg.addColorStop(1, "#5aa832");
    ctx.fillStyle = gg;
    ctx.fillRect(0, y, W, 22);
    // stripes
    ctx.fillStyle = "#73c13f";
    for (let x = groundX - 48; x < W + 48; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, y + 22); ctx.lineTo(x + 24, y + 22); ctx.lineTo(x + 12, y); ctx.lineTo(x - 12, y);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#3f7a22";
    ctx.fillRect(0, y, W, 3);
    ctx.fillRect(0, y + 22, W, 3);
    // dirt texture
    ctx.fillStyle = "rgba(160,140,70,.35)";
    for (let x = groundX * 0.999 - 48; x < W + 48; x += 48) {
      ctx.fillRect(x + 8, y + 40, 14, 4);
      ctx.fillRect(x + 30, y + 64, 10, 4);
      ctx.fillRect(x + 16, y + 88, 12, 4);
    }
  }

  function drawHero() {
    const { x, y, r } = hero;
    ctx.save();
    ctx.translate(x, y);

    // tornado swirl behind the head
    ctx.save();
    ctx.rotate(-time * 6 - hero.spin);
    for (let i = 0; i < 3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      ctx.beginPath();
      ctx.arc(0, 0, r + 9 + i * 2, 0, Math.PI * 0.9);
      ctx.strokeStyle = `rgba(255,255,255,${0.75 - i * 0.18})`;
      ctx.lineWidth = 4 - i;
      ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.restore();

    // tornado tail
    ctx.save();
    ctx.rotate(hero.rot * 0.5);
    for (let i = 0; i < 4; i++) {
      const w = 34 - i * 8;
      const ty = r + 2 + i * 9;
      const wob = Math.sin(time * 14 + i) * 4;
      ctx.beginPath();
      ctx.ellipse(-6 - i * 4 + wob, ty, w / 2, 4, -0.2, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,225,255,${0.8 - i * 0.15})`;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();

    ctx.rotate(hero.rot);

    // shadow ring
    ctx.beginPath();
    ctx.arc(2, 3, r + 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fill();

    // face photo, circle-clipped
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    if (face.complete && face.naturalWidth) {
      ctx.drawImage(face, -r, -r, r * 2, r * 2);
    } else {
      ctx.fillStyle = "#f2c9a0"; ctx.fillRect(-r, -r, r * 2, r * 2);
    }
    // soft shine
    const sh = ctx.createRadialGradient(-r * 0.4, -r * 0.5, 2, 0, 0, r);
    sh.addColorStop(0, "rgba(255,255,255,.25)");
    sh.addColorStop(0.5, "rgba(255,255,255,0)");
    ctx.fillStyle = sh;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();

    // border
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#ffd54f";
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#8a5a00";
    ctx.beginPath();
    ctx.arc(0, 0, r + 2.5, 0, Math.PI * 2);
    ctx.stroke();

    // little flapping cape-wing
    const flapA = state === "play" ? Math.sin(time * 22) * 0.6 : Math.sin(time * 8) * 0.4;
    ctx.save();
    ctx.translate(-r + 4, 6);
    ctx.rotate(-0.5 + flapA);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-22, -6, -26, 10);
    ctx.quadraticCurveTo(-12, 6, 0, 10);
    ctx.closePath();
    ctx.fillStyle = "#e53935";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#7f1010";
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function outlinedText(text, x, y, size, fill = "#fff", stroke = "#1b2a41", align = "center", lw = null) {
    ctx.font = `900 ${size}px "Trebuchet MS", "Arial Black", system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = lw || Math.max(4, size / 6);
    ctx.strokeStyle = stroke;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawTitle(y) {
    const bob = Math.sin(time * 2.5) * 5;
    ctx.save();
    ctx.translate(W / 2, y + bob);
    ctx.rotate(Math.sin(time * 1.5) * 0.03);
    const g = ctx.createLinearGradient(0, -30, 0, 30);
    g.addColorStop(0, "#fff59d");
    g.addColorStop(1, "#ff9800");
    outlinedText("RADO", 0, -30, 64, g, "#1b2a41", "center", 12);
    const g2 = ctx.createLinearGradient(0, 20, 0, 70);
    g2.addColorStop(0, "#b3e5fc");
    g2.addColorStop(1, "#0288d1");
    outlinedText("TORNADO", 0, 34, 58, g2, "#1b2a41", "center", 12);
    ctx.restore();
  }

  function panel(x, y, w, h) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.35)";
    ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
    roundRect(x, y, w, h, 18);
    ctx.fillStyle = "#fff4d6";
    ctx.fill();
    ctx.restore();
    roundRect(x, y, w, h, 18);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#8a5a00";
    ctx.stroke();
    roundRect(x + 8, y + 8, w - 16, h - 16, 12);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(138,90,0,.3)";
    ctx.stroke();
  }

  function medal(x, y, s) {
    let c1, c2, label;
    if (s >= 40) { c1 = "#e0f7fa"; c2 = "#4dd0e1"; label = "P"; }
    else if (s >= 20) { c1 = "#fff59d"; c2 = "#f9a825"; label = "G"; }
    else if (s >= 10) { c1 = "#eceff1"; c2 = "#90a4ae"; label = "S"; }
    else if (s >= 5) { c1 = "#ffcc80"; c2 = "#bf6f2a"; label = "B"; }
    else {
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(138,90,0,.12)"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(138,90,0,.3)"; ctx.stroke();
      return;
    }
    const g = ctx.createRadialGradient(x - 8, y - 10, 2, x, y, 32);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
    // sparkle
    const sp = (Math.sin(time * 5) + 1) / 2;
    ctx.fillStyle = `rgba(255,255,255,${0.4 + sp * 0.6})`;
    ctx.beginPath();
    ctx.arc(x - 12, y - 12, 3 + sp * 2, 0, Math.PI * 2);
    ctx.fill();
    outlinedText("★", x, y + 2, 28, "#fff", "rgba(0,0,0,.4)", "center", 4);
  }

  function tapHint(y) {
    const a = 0.55 + 0.45 * Math.sin(time * 5);
    ctx.globalAlpha = a;
    outlinedText("Click or press SPACE", W / 2, y, 22, "#fff", "#1b2a41", "center", 6);
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    for (const p of pipes) drawPipe(p);
    drawGround();

    for (const p of particles) {
      ctx.fillStyle = p.c + (p.life / p.max) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / p.max + 0.3), 0, Math.PI * 2);
      ctx.fill();
    }

    drawHero();

    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      outlinedText("+1", p.x, p.y, 26, "#ffeb3b", "#1b2a41");
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // HUD / screens
    if (state === "play" || state === "ready") {
      outlinedText(String(score), W / 2, 80, 64, "#fff", "#1b2a41", "center", 10);
    }

    if (state === "menu") {
      drawTitle(150);
      outlinedText("Best: " + best, W / 2, 470, 26, "#fff", "#1b2a41");
      tapHint(530);
    }

    if (state === "ready") {
      outlinedText("Get Ready!", W / 2, 190, 44, "#ffeb3b", "#1b2a41", "center", 9);
      // tap icon
      ctx.save();
      ctx.translate(hero.x + 80, hero.y);
      const p = 1 + 0.1 * Math.sin(time * 8);
      ctx.scale(p, p);
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#1b2a41"; ctx.stroke();
      outlinedText("TAP", 0, 1, 14, "#e53935", "#fff", "center", 3);
      ctx.restore();
      tapHint(H - GROUND_H - 120);
    }

    if (state === "dead") {
      const t = Math.min(1, (time - deadTime) / 0.5);
      const ease = 1 - Math.pow(1 - t, 3);
      ctx.save();
      ctx.globalAlpha = ease;
      outlinedText("Game Over", W / 2, 170 - (1 - ease) * 40, 52, "#ff7043", "#1b2a41", "center", 10);

      const py = 240 + (1 - ease) * 120;
      panel(46, py, W - 92, 200);
      ctx.font = "800 18px 'Trebuchet MS', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#c0671a";
      ctx.fillText("MEDAL", 120, py + 40);
      medal(120, py + 105, score);

      ctx.textAlign = "right";
      ctx.fillStyle = "#c0671a";
      ctx.fillText("SCORE", W - 80, py + 40);
      outlinedText(String(score), W - 80, py + 78, 40, "#fff", "#1b2a41", "right", 8);
      ctx.font = "800 18px 'Trebuchet MS', system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.fillStyle = "#c0671a";
      ctx.fillText("BEST", W - 80, py + 122);
      outlinedText(String(best), W - 80, py + 160, 40, "#fff", "#1b2a41", "right", 8);
      if (newBest) {
        ctx.save();
        ctx.translate(W - 175, py + 150);
        ctx.rotate(-0.15);
        roundRect(-32, -13, 64, 26, 8);
        ctx.fillStyle = "#e53935"; ctx.fill();
        outlinedText("NEW!", 0, 1, 16, "#fff", "#7f1010", "center", 3);
        ctx.restore();
      }
      ctx.restore();
      if (time - deadTime > 0.6) tapHint(500);
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
